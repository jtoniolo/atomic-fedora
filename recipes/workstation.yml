# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: atomic-workstation
description: ThinkPad T14 AMD developer & gaming workstation.

base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  # --- FIX: Use 'containerfile' for inline commands instead of 'script' ---
  - type: containerfile
    snippets:
      - RUN systemctl mask power-profiles-daemon.service
      - RUN dnf remove -y tuned-ppd || true

  - type: dnf
    repos:
      files:
        - antigravity.repo
        - starship.repo
        # negativo17-multimedia removed - no F43 packages, aurora-dx has fedora-multimedia
      # atim/starship added as .repo file instead of copr: shorthand
      # because Aurora's OS ID prevents COPR chroot auto-detection
    install:
      packages:
        # --- AI CODING ASSISTANT ---
        - antigravity

        # --- THINKPAD T14 GEN 2 AMD HARDWARE ---
        - fwupd
        - radeontop
        - libva-utils
        - acpi
        - tlp
        - tlp-rdw

        # --- SHELL & CORE UTILITIES ---
        - starship
        - micro
        - bat
        - ripgrep
        - p7zip
        - p7zip-plugins
        - ncdu
        - btop
        - duf

        # --- SYSTEM ADMIN ---
        - btrfs-assistant
        - snapper

        # --- KDE and GUI Apps ---
        - kio-gdrive
        - kpeoplevcard

  # --- VOXTYPE (push-to-talk voice-to-text) ---
  # No upstream dnf repo/COPR exists, so the release RPM is pinned by URL.
  # The RPM is unsigned (detached .asc only), hence no-gpgchecks in its own
  # dnf block so the main install above keeps signature checking.
  - type: dnf
    install:
      no-gpgchecks: true
      packages:
        - https://github.com/peteonrails/voxtype/releases/download/v0.7.5/voxtype-0.7.5-1.x86_64.rpm
        # Wayland typing/clipboard/notification helpers voxtype shells out to
        - wtype
        - wl-clipboard
        - libnotify
        - playerctl

  - type: containerfile
    snippets:
      # The RPM's %post picks the /usr/bin/voxtype variant from the BUILD host's
      # CPU. CI runners have AVX-512; the T14's Zen 3 (Cezanne) does not, which
      # would mean SIGILL on first run. Pin the symlink to the avx2 build.
      - RUN rm -f /usr/bin/voxtype && ln -sf /usr/lib/voxtype/voxtype-avx2 /usr/bin/voxtype
      # Drop the variants this hardware can't use (~450 MB of NVIDIA/ROCm/AVX-512).
      - RUN rm -rf /usr/lib/voxtype/cuda-12 /usr/lib/voxtype/cuda-13 /usr/lib/voxtype/migraphx
        /usr/lib/voxtype/voxtype-onnx-cuda-12 /usr/lib/voxtype/voxtype-onnx-cuda-13
        /usr/lib/voxtype/voxtype-onnx-migraphx /usr/lib/voxtype/voxtype-onnx-rocm
        /usr/lib/voxtype/voxtype-avx512 /usr/lib/voxtype/voxtype-onnx-avx512

  # --- DISPLAYLINK SUPPORT ---
  # Build evdi kernel module (not available in ublue-os/akmods)
  - type: script
    scripts:
      - build-evdi.sh

  - type: systemd
    system:
      enabled:
        - sshd.service
        - cups.service
        - tailscaled.service
        - tlp.service
        - displaylink.service
        - create-swapfile.service
        - var-swapfile.swap
        #- cockpit.socket

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # --- BROWSERS ---
          - org.mozilla.firefox
          - com.google.Chrome
          - com.brave.Browser
          - com.microsoft.Edge

          # --- DEVELOPMENT ---
          - com.getpostman.Postman
          - io.dbeaver.DBeaverCommunity
          - com.mongodb.Compass
          - rest.insomnia.Insomnia
          - io.podman_desktop.PodmanDesktop

          # --- GAMING ---
          - org.prismlauncher.PrismLauncher
          - com.valvesoftware.Steam
          - com.heroicgameslauncher.hgl
          - net.lutris.Lutris
          - net.davidotek.pupgui2
          - org.gnome.Mahjongg

          # --- PRODUCTIVITY & TOOLS ---
          - com.github.tchx84.Flatseal
          - com.bitwarden.desktop
          - org.onlyoffice.desktopeditors
          - org.libreoffice.LibreOffice
          - com.nextcloud.desktopclient.nextcloud
          - com.actualbudget.actual
          - org.kde.kcalc
          - org.localsend.localsend_app
          - io.github.kolunmi.Bazaar
          - md.obsidian.Obsidian

          # --- COMMUNICATION & MESSAGING ---
          - com.discordapp.Discord
          - us.zoom.Zoom

          # --- MEDIA ---
          - org.videolan.VLC
          - com.obsproject.Studio
          - com.spotify.Client
          - com.plexamp.Plexamp
          - tv.plex.PlexDesktop

  - type: signing
